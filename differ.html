	function startGame(){
		if (parseInt(localStorage.Difcool) <= 0 ||  localStorage.Diflvl === '69' ){
			hide('homeSc')
			hide('helpSc')
			hide('startBut')
			hide('startBut2')

			show('player')
			newSave('Diflvl', 1)
			newSave('GamP1', 0)
			newSave('CDLVL', 0)
			localStorage.Difcool = Math.floor(600 * (100 - parseInt(localStorage.CDLVL)) / 100)
			for (i = 2; i <= 240; i++){
				newTile = document.getElementById('body').appendChild(document.getElementById('tile1').cloneNode(true))
				newTile.setAttribute('id','tile' + i)
				newTile.style.left = 50 * (i - 1) - Math.floor((i - 1) / 20) * 1000
				newTile.style.top = 50 * Math.floor((i - 1) / 20)
				//newTile.textContent = i

			generateLevel()
			generateRoom(10)
			gameLoop()
		} else {

	function generateRoom(roomChar){
		room = roomChar + ''
		if (roomChar === '#'){
			room = 10
		} else if (room.charCodeAt(0) > 96){
			room = room.charCodeAt(0) - 86
		} else if (room.charCodeAt(0) > 64){
			room = room.charCodeAt(0) - 54
		}
		//console.log(roomChar + ' ' + room)
		amount = 0
		type = ''
		current = 1
		roomData = window["room" + room]
		for (i = 0; i < roomData.length; i++){
			thing = roomData[i]
			if (thing === ' '){
				
			} else if (thing > -1){
				amount = parseInt(amount + thing)
			} else {
				type = thing
				for (j = current; j < current + amount; j++){
					document.getElementById("tile" + j).classList = ''
					document.getElementById("tile" + j).classList.add(type)
					document.getElementById("tile" + j).classList.add('tile')
				}
				current = current + amount
				amount = 0
			}
		}
		if (levelData[roomPlayerIn + 1] && levelData[roomPlayerIn + 1].charCodeAt(0) > 64 && levelData[roomPlayerIn + 1].charCodeAt(0) < 69 || levelData[roomPlayerIn].charCodeAt(0) > 69){
			for (j = 9; j < 13; j++){
				document.getElementById("tile" + j).classList = ''
				document.getElementById("tile" + j).classList.add('tile')
				document.getElementById("tile" + j).classList.add('a')
			}
			document.getElementById("tile8").classList = ''
			document.getElementById("tile8").classList.add('tile')
			document.getElementById("tile8").classList.add('k')
			document.getElementById("tile13").classList = ''
			document.getElementById("tile13").classList.add('tile')
			document.getElementById("tile13").classList.add('m')
		}
		if (levelData[roomPlayerIn + 1] && levelData[roomPlayerIn + 1].charCodeAt(0) > 96 || levelData[roomPlayerIn + 1] && levelData[roomPlayerIn + 1].charCodeAt(0) > 64 && levelData[roomPlayerIn + 1].charCodeAt(0) < 69 && levelData[roomPlayerIn + 2] && levelData[roomPlayerIn + 2].charCodeAt(0) > 96 || levelData[roomPlayerIn].charCodeAt(0) > 64 && levelData[roomPlayerIn].charCodeAt(0) < 69){
			for (j = 229; j < 233; j++){
				document.getElementById("tile" + j).classList = ''
				document.getElementById("tile" + j).classList.add('tile')
				document.getElementById("tile" + j).classList.add('a')

			document.getElementById("tile228").classList.add('k')
			document.getElementById("tile233").classList = ''
			document.getElementById("tile233").classList.add('tile')
			document.getElementById("tile233").classList.add('m')
		}

				item.classList.remove('hide')
			} else {

			}
		}

	function checkMove(entity, x, y, isId){ //make all objects <= 50x50
		if (isId === 1){
			entity = document.getElementById(entity)
		}
		l = left(entity)
		t = up(entity)
		if (x === 0){ // error may be from -ve is up
			if (y > 0){
				angel = Math.PI / 2
			} else {
				angel = - Math.PI / 2
			}
		} else {
			angel = Math.atan(y / x)
			if (x < 0 && y >= 0){
				angel = angel + Math.PI
			} else if (x < 0 && y <= 0){
				angel = angel + Math.PI
			}
		}
		r = (x ** 2 + y ** 2) ** 0.5
		//console.log(angel + '  ' + r + ' ' + l + ' ' + t + ' ' + x + ' ' + y)
		moveTr = true
		for (i = 1; i <= Math.floor(r / 50) && moveTr; i++){
			for (j = 0; j <= 1 && moveTr; j++){
				for (k = 0; k <= 1 && moveTr; k++){
					xProj = l + Math.cos(angel) * i * 50 + Math.round(j * parseInt(entity.style.width)) - j
					yProj = t + Math.sin(angel) * i * 50 + Math.round(k * parseInt(entity.style.height)) - k
					tile = Math.floor(xProj / 50) + 20 * Math.floor(yProj / 50) + 1
					if (xProj >= 1000 || xProj <= 0 || yProj >= 600 || yProj <= 0){
						moveTr = false
					} else {
						if (document.getElementById("tile" + tile).classList.contains('a') === false){
							moveTr = false
						}
					}
				}
			}
		}
		for (j = 0; j <= 1 && moveTr; j++){
			for (k = 0; k <= 1 && moveTr; k++){
				xProj = l + Math.cos(angel) * r + Math.round(j * parseInt(entity.style.width)) - j
				yProj = t + Math.sin(angel) * r + Math.round(k * parseInt(entity.style.height)) - k
				tile = Math.floor(xProj / 50) + 20 * Math.floor(yProj / 50) + 1
				if (xProj >= 1000 || xProj <= 0 || yProj >= 600 || yProj <= 0){
					moveTr = false
				} else {
					if (document.getElementById("tile" + tile).classList.contains('a') === false){
						moveTr = false
					}
				}
			}
		}
		return moveTr
	}

	function getWeaponStats(weapon, stat){
		if (stat === 1){
			if (weapon < 16){ // firerate
				return 27 - weapon * 2 + 20 //- 100
			} else if (weapon < 26){
				return 10 - weapon + 20
			} else if (weapon < 36){
				return 45 - weapon * 5 + 150
			} else if (weapon < 46){
				return 55 - weapon * 5 + 200
			}
		} else if (stat === 2){ // spread
			if (weapon < 16){
				return 25 - weapon * 5 + 50
			} else if (weapon < 26){
				return 90 - weapon * 10 + 200
			} else if (weapon < 36){
				return 65 - weapon * 5 + 150
			} else if (weapon < 46){
				return 0
			}
		} else if (stat == 3){ // ammo consumption
			if (weapon < 26){
				return 1
			} else if (weapon < 36){
				return 8
			} else if (weapon < 46){
				return 12
			}
		}
	}

	function canSeePlayer(enemy){
		l = left(enemy)
		t = up(enemy)
		if (left(player) - l === 0){
			if (t - up(player) > 0){
				angel = Math.PI / 2
			} else {
				angel = - Math.PI / 2
			}
		} else {
			angel = Math.atan((t - up(player)) / (l - left(player)))
			if (l - left(player) > 0){
				angel = angel + Math.PI
			//}// else if (l - left(player) < 0 && t - up(player) <= 0){
			//	angel = angel + Math.PI
			}
		}
		r = ((l - left(player)) ** 2 + (t - up(player)) ** 2) ** 0.5
		//console.log(angel)
		seeTr = true
		for (i = 1; i <= Math.floor(r / 50) && seeTr; i++){
			xProj = l + Math.cos(angel) * i * 50 + 25
			yProj = t + Math.sin(angel) * i * 50 + 25
			tile = Math.floor(xProj / 50) + 20 * Math.floor(yProj / 50) + 1
			if (xProj >= 1000 || xProj <= 0 || yProj >= 600 || yProj <= 0){
				seeTr = false
			} else {
				if (document.getElementById("tile" + tile).classList.contains('a') === false){
					seeTr = false
					//console.log('failed tile = ' + tile)
				}
			}
		}
		return seeTr
	}

	function openningBox(t, type, value, num){
		if (t > 40 && document.getElementById('lootBoxSlot' + num)){
			document.getElementById('lootBoxSlot' + num).remove()
		} else if (t > 10 && document.getElementById('lootBoxSlot' + num)){
			document.getElementById('lootBoxSlot' + num).style.opacity = (42 - t) / 40
			setTimeout(openningBox, 20, t + 1, type, value, num)
		} else {
			if (type === 1 && t === 0){
				thing = document.getElementById('body').appendChild(document.getElementById('scoreRewardNode').cloneNode(true))
				thing.setAttribute('id', 'awdioagwvga')
				thing.textContent = '+' + value
				thing.setAttribute('value', value)
				thing.classList.remove('hide')
				thing.style.left = 605 - (lootBoxesCollected) * 35 + (num - 1) * 70 - 20
				moveThingy(thing, 0, 605 - (lootBoxesCollected) * 35 + (num - 1) * 70 - 20, 420, 550, 210, 1)
			} else if (type === 2 && t === 0){
				createAnom(value, num)
			} else if ((type === 3 || type === 4) && t === 0){
				thing = document.getElementById('body').appendChild(document.getElementById('scoreRewardNode').cloneNode(true))
				thing.setAttribute('id', 'awdioagwwvga')
				thing.style.color = '#7f7f7f'
				thing.textContent = '+1'
				thing.classList.remove('hide')
				thing.style.left = 605 - (lootBoxesCollected) * 35 + (num - 1) * 70 - 20
				moveThingy(thing, 0, 605 - (lootBoxesCollected) * 35 + (num - 1) * 70 - 20, 420, 540, 270, type)
			}
			setTimeout(openningBox, 20, t + 1, type, value, num)
		}
	}
	function moveThingy(thingy, t, xI, yI, xF, yF, type){
		t = t + 1
		//console.log(t)
		if (t <= 40){
			setTimeout(moveThingy, 20, thingy, t, xI, yI, xF, yF, type)
		} else if (t <= 60){
			thingy.style.left = xI - (xI - xF) * (t - 40) / 20
			thingy.style.top = yI - (yI - yF) * (t - 40) / 20
			setTimeout(moveThingy, 20, thingy, t, xI, yI, xF, yF, type)
		} else {
			if (type === 1){
				score = score + parseInt(thingy.getAttribute('value'))
				document.getElementById('rewardScoreText1').textContent = 'Score = ' + score
				xpReward = score * (lootBoxesCollected + 1) * (parseInt(localStorage.GamP1) + 1)
				document.getElementById('rewardScoreText3').textContent = 'Xp = ' + xpReward
				localStorage.xp = parseInt(localStorage.xp) + (parseInt(thingy.getAttribute('value')) * ((lootBoxesCollected + 1) * (parseInt(localStorage.GamP1) + 1) * (parseInt(localStorage.Diflvl))))
				thingy.remove()
			} else if (type === 2){
				thingy.children[0].classList.remove('hide')
				thingy.children[2].classList.remove('hide')
			} else if (type === 3 || type === 4){
				document.getElementById('rewardScoreText4').classList.remove('hide')
				usbRewards = usbRewards + 1
				document.getElementById('rewardScoreText4').textContent = "Items you probabaly don't care about = " + usbRewards
				thingy.remove()
				newSave('usbDif' + (type - 2), 0)
				localStorage.setItem('usbDif' + (type - 2), parseInt(localStorage.getItem('usbDif' + (type - 2))) + 1)
			}
		}
	}
	function createAnom(amount, num){
		if (amount > 0){
			let x = Math.random()
			if (x < 0.25){
				type = 'pistol'
			} else if (x < 0.5){
				type = 'smg'
			} else if (x < 0.75){
				type = 'shotgun'
			} else {
				type = 'crossbow'
			}
			adrop(type, num)
			setTimeout(createAnom, 2000, amount - 1, num)
		}
	}
	function adrop(item,num){ //anom = border + bonus type, anomi = item, anoma = background + title, rarity as C R E L Re Co, tier is number 1-7
		if (localStorage.anomTr === '1'){
			if (true){
				let y = Math.floor(Math.random() * 1000) + 1
				let aA = (parseInt(localStorage.recycleCo) / 16)
				let bB = (parseInt(localStorage.recycleRe) / 8)
				let cC = (parseInt(localStorage.recycleL) / 4)
				let dD = (parseInt(localStorage.recycleE) / 2)
				let eE = parseInt(localStorage.recycleR)
				if (y <= 1 + aA){
					rarity = 'Co'
				} else if (y <= 10 + aA * 4 + bB){
					rarity = 'Re'
				} else if (y <= 50 + aA * 16 + bB * 4 + cC){
					rarity = 'L'
				} else if (y <= 300 + aA * 64 + bB * 16 + cC * 4 + dD){
					rarity = 'E'
				} else if (y <= 500 + aA * 256 + bB * 64 + cC * 16 + dD * 4 + eE){
					rarity = 'R'
				} else {
					rarity = 'C'
				}
			}
			if (true){
				if (item === 'pistol'){ //newAnom chances of bonus
					bonus = createBonus(94,1,1,1,1,1)
				} else if (item === 'smg'){
					bonus = createBonus(95,5,0,0,0,0)
				} else if (item === 'shotgun'){
					bonus = createBonus(95,0,0,0,5,0)
				} else if (item === 'crossbow'){
					bonus = createBonus(95,0,0,0,0,5)
				}
			}
			if (true){
				for (let N = 10; N <= 23 + ifFound('greenU1'); N++){
					if (localStorage.getItem('anom' + N)){
					
					} else {
						totalAnom = totalAnom + 1
						localStorage.setItem('anom' + N, item + rarity + bonus)
						let anomThingy = document.getElementById('body').appendChild(document.getElementById('anomRewardNode').cloneNode(true))
						anomThingy.children[0].classList.add('item' + rarity)
						anomThingy.children[0].classList.add('itemT' + bonus)
						anomThingy.children[1].classList.add(item + 'V2')
						anomThingy.children[2].classList.add('item' + rarity + '2')
						anomThingy.children[2].setAttribute('title', makeAnomTitle(localStorage.getItem('anom' + N)))
						anomThingy.classList.remove('hide')
						console.log('Collected a ' + rarity + ' ' + item + ' with bonus ' + bonus)
						anomThingy.style.left = 605 - lootBoxesCollected * 35 + (num - 1) * 70
						//console.log(num)
						moveThingy(anomThingy, 0, parseInt(anomThingy.style.left), 405, 35 + 65 * totalAnom, 350, 2)
						if (rarity === 'C'){
							newSave('ach44',0)
							localStorage.ach44 = parseInt(localStorage.ach44) + 1
						} else if (rarity === 'R'){
							newSave('ach51',0)
							localStorage.ach51 = parseInt(localStorage.ach51) + 1
						}
						return true	
					}
				}		
			} else {
				return false
			}
		}
	}
	function createBonus(a,b,c,d,e,f){
		let x = Math.floor(Math.random() * 100) + 1
		if (x <= a){
			return 1
		} else if (x <= a + b){
			return 2
		} else if (x <= a + b + c){
			return 3
		} else if (x <= a + b + c + d){
			return 4
		} else if (x <= a + b + c + d + e){
			return 5
		} else if (x <= a + b + c + d + e + f){
			return 6
		} else {
			return 7
		}
	}
	function findRarity(value,itemTr){
		rare = value.slice(-3,-1)
		if ((rare === 'Re'|| rare === 'Co') && itemTr === 1){
			return value.slice(0,-3)
		} else if (itemTr === 1){
			return value.slice(0,-2)
		}
		if (rare === 'Co'){
			return 'Co'
		} else if (rare === 'Re'){
			return 'Re'
		} else if (rare.includes('L')){
			return 'L'
		} else if (rare.includes('E')){
			return 'E'
		} else if (rare.includes('R')){
			return 'R'
		} else if (rare.includes('C')){
			return 'C'
		}
	}
	function makeAnomTitle(value){
		let rare = findRarity(value)
		let item = findRarity(value,1)
		let bonus = parseInt(value.slice(-1))
		let title = ''
		if (item === 'pistol'){ //newAnom
			title = 'pistol - gun go pew pew'
		} else if (item === 'smg'){
			title = 'smg - even more pew pew'
		} else if (item === 'shotgun'){
			title = 'shotgun - best melee weapon in the game'
		} else if (item === 'crossbow'){
			title = 'crossbow - *counterplay*'
		}
		if (bonus === 1){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to your attack' 
		} else if (bonus === 2){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to your defence' 
		} else if (bonus === 3){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to your drop chance' 
		} else if (bonus === 4){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to your stone chance' 
		} else if (bonus === 5){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to drone build speed' 
		} else if (bonus === 6){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to drone upgrade speed' 
		} else if (bonus === 7){
			title = title + '\nEquiping this will give a +' + rareBonus(rare) + '% bonus to xp gain' 
		}
		if (rare === 'C'){
			title = 'Common ' + title + '\nRecycling this item will fill up the recycle progress by 25%'
		} else if (rare === 'R'){
			title = 'Rare ' + title + '\nRecycling this item will fill up the recycle progress by 50%'
		} else if (rare === 'E'){
			title = 'Epic ' + title + '\nRecycling this item will fill up the recycle progress by 75%'
		} else if (rare === 'L'){
			title = 'Legendary ' + title + '\nRecycling this item will fill up the recycle progress by 50% and also give you a free enhanced item'
		} else if (rare === 'Re'){
			title = 'Relic ' + title + '\nRecycling this item will fill up the recycle progress by 50% and also give you two free enhanced items'
		} else if (rare === 'Co'){
			title = 'Contraband ' + title + '\nRecycling this item will fill up the recycle progress by 50% and also give you seven free enhanced items'
		}
		return title
	}
	function rareBonus(rare){
		if (rare === 'C'){
			return 2
		} else if (rare === 'R'){
			return 5
		} else if (rare === 'E'){
		return 8
		} else if (rare === 'L'){
			return 12
		} else if (rare === 'Re'){
			return 18
		} else if (rare === 'Co'){
			return 25
		} else {
			return ' ERROR: ' + rare + ' IS NOT YES'
		}
	}
	function newSave(thing, value){ //thing must be string
		if (localStorage.getItem(thing)){
			return true
		} else {
			localStorage.setItem(thing, value)
			return localStorage.getItem(thing)
		}
	}
	function deleteAll(className){
		if (document.getElementsByClassName(className)){
			for (i = 0; i < 1; i++){
				for (object of document.getElementsByClassName(className)){
					object.remove()
				}
				if (document.getElementsByClassName(className).length > 0){
					i = -1
				} else {
					i = 1
				}
			}
		}
	}
	function left(entity){
		return parseFloat(entity.style.left)
	}
	function up(entity){
		return parseFloat(entity.style.top)
	}
	document.addEventListener('keydown', (event) => {
		keysPressed[event.key] = true;
		//console.log(event.key)
		if (event.key === 'Enter'){
			startGame()
		}
	})
	document.addEventListener('keyup', (event) => {
		if (event.key === 'e' || 'E'){
			eCool = 0
		}
		delete keysPressed[event.key];
	})
	function ifFound(item,yes){
		if (yes){
			if (localStorage.getItem(item)){
				return 1
			} else {
				return 0
			}
		} else {
			if (localStorage.getItem(item)){
				return parseInt(localStorage.getItem(item))
			} else {
				return false
			}
		}
	}

		show('helpSc')
		hide('homeSc')
		hide('startBut')
		show('startBut2')
